
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whistle FC Results</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="main-header">
<div class="header-container">

<div class="logo">
<img src="images/logo.png" alt="Whistle FC Logo">
</div>

<div class="club-title">
<h1>Whistle Football Club</h1>
<p>Results</p>
</div>

</div>
</header>

<nav class="navbar">
<ul>

<li><a href="index.html">Home</a></li>
<li><a href="news.html">News</a></li>
<li><a href="players.html">Players</a></li>
<li><a href="staff.html">Staff</a></li>
<li><a href="history.html">History</a></li>
<li><a href="fixtures.html">Fixtures</a></li>
<li><a class="active" href="results.html">Results</a></li>
<li><a href="leaguetable.html">League Table</a></li>

</ul>
</nav>

<div class="container">

<section class="results-section">

<h2>Season Results</h2>

<table>
<table class="table">


<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>H/A</th>
<th>Score</th>
<th>Competition</th>
<th>Result</th>
</tr>
</thead>

<tbody id="results-table"></tbody>

</table>

</section>

</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<script>
fetch("results/results.json")
.then(res => res.json())
.then(data => {

const table = document.getElementById("results-table");

// Sort by newest date first
data.sort((a, b) => new Date(b.date) - new Date(a.date));

data.forEach(match => {

const isWhistleHome = match.home === "Whistle FC";

// Opponent + logo
const opponent = isWhistleHome ? match.away : match.home;
const opponentLogo = isWhistleHome ? match.awaylogo : match.homelogo;

// H or A
const homeAway = isWhistleHome ? "H" : "A";

// Format date
const formattedDate = new Date(match.date).toLocaleDateString("en-GB");

// Create row
const row = document.createElement("tr");

row.innerHTML = `
<td>${formattedDate}</td>

<td class="opponent-cell">
  ${opponent}
</td>

<td>${homeAway}</td>

<td>${match.score}</td>

<td>${match.competition}</td>

<td class="result ${match.result.toLowerCase()}">${match.result}</td>
`;
table.appendChild(row);

});

})
.catch(err => {
console.error("Error loading results:", err);
});
</script>

</body>
</html>
