<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whistle FC Results</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="main-header">

<div class="header-container">

<div class="logo">
<img src="images/logo.png" alt="Whistle FC Logo">
</div>

<div class="club-title">
<h1>Whistle Football Club</h1>
<p>Results</p>
</div>

</div>

</header>

<nav class="navbar">

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="news.html">News</a></li>
<li><a href="players.html">Players</a></li>
<li><a href="staff.html">Staff</a></li>
<li><a href="history.html">History</a></li>
<li><a href="fixtures.html">Fixtures</a></li>
<li><a class="active" href="results.html">Results</a></li>
<li><a href="leaguetable.html">League Table</a></li>

</ul>

</nav>

<div class="container">

<section class="results-section">

<h2>Season Results</h2>

<table>

<thead>

<tr>

<th>Date</th>
<th>Opponent</th>
<th>H/A</th>
<th>Score</th>
<th>Competition</th>
<th>Result</th>

</tr>

</thead>

<tbody id="results-table"></tbody>

</table>

</section>

</div>

<script>

fetch("results/results.json")

.then(res => res.json())

.then(data => {

const table = document.getElementById("results-table");

const whistle = "Whistle FC";

data.forEach(match => {

const opponent = match.home === whistle ? match.away : match.home;

const homeAway = match.home === whistle ? "H" : "A";

const row = document.createElement("tr");

row.innerHTML = `
<td>${match.date}</td>
<td>${opponent}</td>
<td>${homeAway}</td>
<td>${match.score}</td>
<td>${match.competition}</td>
<td class="${match.result.toLowerCase()}">${match.result}</td>
`;

table.appendChild(row);

});

});

</script>

</body>
</html>
