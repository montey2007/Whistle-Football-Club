<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistle FC Results</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <img src="images/logo.png" alt="Whistle FC Logo">
      </div>

      <div class="club-title">
        <h1>Whistle Football Club</h1>
        <p>Results</p>
      </div>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-container">
      <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation">
        ☰
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="players.html">Players</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a class="active" href="results.html">Results</a></li>
        <li><a href="leaguetable.html">League Table</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="latest-result">
    <div class="container">
      <section class="results-section">
        <h2 class="section-title">Season Results</h2>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Opponent</th>
                <th>H/A</th>
                <th>Score</th>
                <th>Competition</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="results-table"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Whistle Football Club. All rights reserved.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    fetch("results/results.json")
      .then(response => response.json())
      .then(data => {
        const table = document.getElementById("results-table");

        // Sort newest first
        data.sort((a, b) => new Date(b.date) - new Date(a.date));

        data.forEach(match => {
          const isWhistleHome = match.home === "Whistle FC";

          // Opponent
          const opponent = isWhistleHome ? match.away : match.home;

          // Home or Away
          const homeAway = isWhistleHome ? "H" : "A";

          // Date format
          const formattedDate = new Date(match.date).toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric"
          });

          // Result class
          const resultClass = match.result.toLowerCase();

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${formattedDate}</td>
            <td>${opponent}</td>
            <td>${homeAway}</td>
            <td><strong>${match.score}</strong></td>
            <td>${match.competition}</td>
            <td class="result ${resultClass}">${match.result}</td>
          `;

          table.appendChild(row);
        });
      })
      .catch(error => {
        console.error("Error loading results:", error);
        document.getElementById("results-table").innerHTML = `
          <tr>
            <td colspan="6">Unable to load results at the moment.</td>
          </tr>
        `;
      });

    // MOBILE MENU TOGGLE
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });
  </script>

</body>
</html>
