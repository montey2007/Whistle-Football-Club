<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistle FC News</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <img src="images/logo.png" alt="Whistle FC Logo">
      </div>

      <div class="club-title">
        <h1>Whistle Football Club</h1>
        <p>Latest News</p>
      </div>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-container">
      <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation">
        ☰
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="news.html">News</a></li>
        <li><a href="players.html">Players</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="results.html">Results</a></li>
        <li><a href="leaguetable.html">League Table</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="news">
    <div class="container">
      <section class="news-section">
        <h2 class="section-title">Latest News</h2>
        <div class="news-grid" id="news-container"></div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Whistle Football Club. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS -->
  <script>
    fetch("news/news.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("news-container");

        data.forEach(article => {
          const card = document.createElement("article");
          card.className = "news-card";

          card.innerHTML = `
            ${article.image ? `<img src="${article.image}" alt="${article.title}">` : ""}
            <h3>${article.title}</h3>
            <p>${article.text}</p>
            <a href="${article.link}">Read More</a>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error("Error loading news:", error);
        document.getElementById("news-container").innerHTML = `
          <p>Unable to load news articles at the moment.</p>
        `;
      });

    // MOBILE MENU TOGGLE
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });
  </script>

</body>
</html>
