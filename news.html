<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whistle FC News</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="main-header">
  <div class="header-container">
    <div class="logo"><img src="images/logo.png" alt="Whistle FC Logo"></div>
    <div class="club-title"><h1>Whistle Football Club</h1><p>News</p></div>
  </div>
</header>

<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a class="active" href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">
<h2>Latest News</h2>
<div class="news-grid" id="news-container"></div>
</div>

  <section>
<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

  </section>

<script>
fetch("news/news.json")
.then(res => res.json())
.then(data => {
  const container = document.getElementById("news-container");
  data.forEach(article => {
    const card = document.createElement("article");
    card.className = "news-card";
       card.innerHTML = `
      <img src="${article.image}" alt="">
      <h3>${article.title}</h3>
      <p>${article.text}</p>
      <a href="${article.link}">Read More →</a>
    `;
    container.appendChild(card);
  });
});
</script>
</body>
</html>
