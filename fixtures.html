<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whistle FC Fixtures</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <div class="header-container">

    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>

    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>Fixtures</p>
    </div>

  </div>
</header>

<!-- NAVIGATION -->
<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a class="active" href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="leaguetable.html">League Table</a></li>
  </ul>
</nav>
  
<section class="fixtures-section">
  <div class="container">
    <h2>Upcoming Fixtures</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Opponent</th><th>H/A</th><th>Competition</th><th>Kick Off</th></tr>
      </thead>
      <tbody id="fixtures-table"></tbody>
    </table>
  </div>
</section>

<script>
fetch("fixtures/fixtures.json")
.then(res => res.json())
.then(data => {
  const table = document.getElementById("fixtures-table");
  data.forEach(match => {
    const row = document.createElement("tr");
    row.innerHTML = `<td>${match.date}</td><td>${match.away}</td><td>${match.homeaway}</td><td>${match.competition}</td><td>${match.time}</td>`;
    table.appendChild(row);
  });
});
</script>
</div>
</body>

</html>
