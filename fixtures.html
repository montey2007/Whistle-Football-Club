<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whistle FC Fixtures</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>
    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>Fixtures</p>
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a class="active" href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">

<section class="fixtures-section">
<h2 class="section-title">Upcoming Fixtures</h2>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>H/A</th>
<th>Competition</th>
<th>Kick Off</th>
</tr>
</thead>

<tbody id="fixtures-table"></tbody>
</table>
</div>

</section>

<footer>
<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
fetch("fixtures/fixtures.json")
.then(res => res.json())
.then(data => {

const table = document.getElementById("fixtures-table");

data.forEach(match => {

const row = document.createElement("tr");

// Determine home/away
const isHome = match.home === "Whistle FC";
const opponent = isHome ? match.away : match.home;
const homeAway = isHome ? "Home" : "Away";

// Format date nicely
const dateObj = new Date(match.date);
const formattedDate = dateObj.toLocaleDateString("en-GB", {
  weekday: "short",
  day: "numeric",
  month: "short"
});

// Build row with mobile labels
row.innerHTML = `
<td data-label="Date">${formattedDate}</td>
<td data-label="Opponent">${opponent}</td>
<td data-label="Venue">${homeAway}</td>
<td data-label="Competition">${match.competition}</td>
<td data-label="Kick Off">${match.time}</td>
`;

table.appendChild(row);

});

});
</script>

</body>
</html>
