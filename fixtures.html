<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistle FC Fixtures</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <img src="images/logo.png" alt="Whistle FC Logo">
      </div>

      <div class="club-title">
        <h1>Whistle Football Club</h1>
        <p>Fixtures</p>
      </div>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-container">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
        ☰
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="players.html">Players</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="history.html">History</a></li>
        <li><a class="active" href="fixtures.html">Fixtures</a></li>
        <li><a href="results.html">Results</a></li>
        <li><a href="leaguetable.html">League Table</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container">
    <section class="fixtures-section">
      <h2 class="section-title">Upcoming Fixtures</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>H/A</th>
              <th>Competition</th>
              <th>Kick Off</th>
            </tr>
          </thead>
          <tbody id="fixtures-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 Whistle Football Club</p>
      <p>Vitality Stadium | Wetshil, England</p>
      <p>Follow us: Twitter | Instagram | YouTube</p>
    </div>
  </footer>

  <script>
    // MOBILE MENU
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });

    document.querySelectorAll(".nav-links a").forEach(link => {
      link.addEventListener("click", () => {
        navLinks.classList.remove("show");
      });
    });

    // FIXTURES
    fetch("fixtures/fixtures.json")
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById("fixtures-table");

        data.forEach(match => {
          const row = document.createElement("tr");

          const isHome = match.home === "Whistle FC";
          const opponent = isHome ? match.away : match.home;
          const homeAway = isHome ? "H" : "A";

          row.innerHTML = `
            <td>${new Date(match.date).toDateString()}</td>
            <td>${opponent}</td>
            <td>${homeAway}</td>
            <td>${match.competition}</td>
            <td>${match.time}</td>
          `;

          table.appendChild(row);
        });
      })
      .catch(err => {
        console.error("Error loading fixtures:", err);
      });
  </script>

</body>
</html>
