<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whistle FC Fixtures</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>
    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>Fixtures</p>
    </div>
  </div>
</header>

<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a class="active" href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">

<section class="fixtures-section">
<h2 class="section-title">Upcoming Fixtures</h2>

<!-- TABLE (DESKTOP) -->
<table class="desktop-table">
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Competition</th>
<th>Kick Off</th>
</tr>
</thead>
<tbody id="fixtures-table"></tbody>
</table>

<!-- MOBILE CARDS -->
<div id="fixtures-cards" class="mobile-cards"></div>

</section>

</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<script>
fetch("fixtures/fixtures.json")
.then(res => res.json())
.then(data => {

const table = document.getElementById("fixtures-table");
const cards = document.getElementById("fixtures-cards");

data.forEach(match => {

const isHome = match.home === "Whistle FC";
const opponent = isHome ? match.away : match.home;
const venue = isHome ? "Home" : "Away";

const dateObj = new Date(match.date);
const formattedDate = dateObj.toLocaleDateString("en-GB", {
  weekday: "short",
  day: "numeric",
  month: "short"
});

/* DESKTOP TABLE */
const row = document.createElement("tr");
row.innerHTML = `
<td>${formattedDate}</td>
<td>${opponent}</td>
<td>${venue}</td>
<td>${match.competition}</td>
<td>${match.time}</td>
`;
table.appendChild(row);

/* MOBILE CARD */
const card = document.createElement("div");
card.classList.add("fixture-card");

card.innerHTML = `
<div class="card-header">
  <span>${formattedDate}</span>
  <span class="venue ${venue.toLowerCase()}">${venue}</span>
</div>

<div class="card-body">
  <h3>Whistle FC vs ${opponent}</h3>
  <p>${match.competition}</p>
  <p><strong>Kick Off:</strong> ${match.time}</p>
</div>
`;

cards.appendChild(card);

});

});
</script>

</body>
</html>
