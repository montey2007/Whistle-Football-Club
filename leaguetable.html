<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League One Table</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Highlighting rows */
    table.league-table tr.promotion { background-color: #c8f7c5; }   /* Light green */
    table.league-table tr.playoff { background-color: #fff8b0; }      /* Light yellow */
    table.league-table tr.relegation { background-color: #f7c5c5; }   /* Light red */
    table.league-table tr.whistle { font-weight: 700; border: 2px solid #c00000; }

    table.league-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-family: 'Poppins', sans-serif;
    }

    table.league-table th,
    table.league-table td {
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    table.league-table th {
      background: #111;
      color: white;
    }

    table.league-table td:nth-child(2) {
      text-align: left;
      font-weight: 600;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <img src="images/logo.png" alt="Whistle FC Logo">
      </div>
      <div class="club-title">
        <h1>Whistle Football Club</h1>
        <p>League One Table</p>
      </div>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="players.html">Players</a></li>
      <li><a href="staff.html">Staff</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="fixtures.html">Fixtures</a></li>
      <li><a href="results.html">Results</a></li>
      <li><a class="active" href="leaguetable.html">League Table</a></li>
    </ul>
  </nav>

  <div class="container">
    <table class="league-table" id="leagueTable">
      <thead>
        <tr>
          <th>Pos</th>
          <th>Team</th>
          <th>P</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>GD</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const leagueData = [
      { position: 1, team: "Lincoln City", played: 41, wins: 27, draws: 9, losses: 5, goals_for: 77, goals_against: 35, points: 90 },
      { position: 2, team: "Cardiff City", played: 40, wins: 23, draws: 9, losses: 8, goals_for: 74, goals_against: 42, points: 78 },
      { position: 3, team: "Bradford City", played: 41, wins: 21, draws: 8, losses: 12, goals_for: 52, goals_against: 45, points: 71 },
      { position: 4, team: "Bolton Wanderers", played: 41, wins: 18, draws: 16, losses: 7, goals_for: 58, goals_against: 41, points: 70 },
      { position: 5, team: "Stockport", played: 40, wins: 19, draws: 10, losses: 11, goals_for: 58, goals_against: 49, points: 67 },
      { position: 6, team: "Stevenage", played: 40, wins: 18, draws: 10, losses: 12, goals_for: 43, goals_against: 39, points: 64 },
      { position: 7, team: "Plymouth Argyle", played: 41, wins: 19, draws: 5, losses: 17, goals_for: 63, goals_against: 57, points: 62 },
      { position: 8, team: "Reading", played: 42, wins: 16, draws: 14, losses: 12, goals_for: 62, goals_against: 54, points: 62 },
      { position: 9, team: "Huddersfield Town", played: 41, wins: 17, draws: 10, losses: 14, goals_for: 61, goals_against: 53, points: 61 },
      { position: 10, team: "Luton Town", played: 41, wins: 17, draws: 10, losses: 14, goals_for: 55, goals_against: 51, points: 61 },
      { position: 11, team: "Wycombe Wanderers", played: 42, wins: 16, draws: 11, losses: 15, goals_for: 60, goals_against: 48, points: 59 },
      { position: 12, team: "Mansfield Town", played: 39, wins: 13, draws: 14, losses: 12, goals_for: 50, goals_against: 42, points: 53 },
      { position: 13, team: "Peterborough United", played: 40, wins: 15, draws: 6, losses: 19, goals_for: 59, goals_against: 55, points: 51 },
      { position: 14, team: "Barnsley", played: 39, wins: 13, draws: 12, losses: 14, goals_for: 61, goals_against: 63, points: 51 },
      { position: 15, team: "Leyton Orient", played: 41, wins: 14, draws: 8, losses: 19, goals_for: 56, goals_against: 64, points: 50 },
      { position: 16, team: "AFC Wimbledon", played: 41, wins: 14, draws: 8, losses: 19, goals_for: 50, goals_against: 61, points: 50 },
      { position: 17, team: "Doncaster Rovers", played: 41, wins: 14, draws: 8, losses: 19, goals_for: 43, goals_against: 63, points: 50 },
      { position: 18, team: "Wigan Athletic", played: 41, wins: 12, draws: 13, losses: 16, goals_for: 43, goals_against: 55, points: 49 },
      { position: 19, team: "Burton Albion", played: 42, wins: 12, draws: 12, losses: 18, goals_for: 46, goals_against: 57, points: 48 },
      { position: 20, team: "Blackpool", played: 42, wins: 13, draws: 9, losses: 20, goals_for: 49, goals_against: 65, points: 48 },
      { position: 21, team: "Exeter City", played: 42, wins: 12, draws: 10, losses: 20, goals_for: 44, goals_against: 54, points: 46 },
      { position: 22, team: "Rotherham United", played: 39, wins: 9, draws: 10, losses: 20, goals_for: 35, goals_against: 58, points: 37 },
      { position: 23, team: "Northampton Town", played: 41, wins: 9, draws: 8, losses: 24, goals_for: 34, goals_against: 59, points: 35 },
      { position: 24, team: "Port Vale", played: 38, wins: 7, draws: 10, losses: 21, goals_for: 29, goals_against: 54, points: 31 }
    ];

    function populateTable() {
      const tbody = document.querySelector("#leagueTable tbody");
      tbody.innerHTML = "";

      leagueData.forEach(team => {
        const row = document.createElement("tr");

        const goalDifference = team.goals_for - team.goals_against;

        let displayName = team.team;
        if (displayName === "Luton Town") displayName = "Whistle FC";

        // Promotion / Playoff / Relegation
        if (team.position <= 2) row.classList.add("promotion");
        else if (team.position >= 3 && team.position <= 6) row.classList.add("playoff");
        else if (team.position >= 21) row.classList.add("relegation");

        // Highlight Whistle FC
        if (displayName === "Whistle FC") row.classList.add("whistle");

        row.innerHTML = `
          <td>${team.position}</td>
          <td>${displayName}</td>
          <td>${team.played}</td>
          <td>${team.wins}</td>
          <td>${team.draws}</td>
          <td>${team.losses}</td>
          <td>${goalDifference > 0 ? "+" + goalDifference : goalDifference}</td>
          <td>${team.points}</td>
        `;

        tbody.appendChild(row);
      });
    }

    populateTable();
  </script>

</body>
</html>
