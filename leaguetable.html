<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>League One Table</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* Highlighting rows */
table.league-table tr.promotion { background-color: #c8f7c5; }  /* Light green */
table.league-table tr.playoff { background-color: #fff8b0; }     /* Light yellow */
table.league-table tr.relegation { background-color: #f7c5c5; } /* Light red */
table.league-table tr.whistle { font-weight: 700; border: 2px solid #c00000; }
table.league-table th, table.league-table td { text-align: center; padding: 10px; }
</style>
</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>
    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>League One Table</p>
    </div>
  </div>
</header>

<!-- NAVIGATION -->
<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a class="active" href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">
  <table class="league-table" id="leagueTable">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Team</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GD</th>
        <th>Pts</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const leagueData = [
  {position:1, team:"Lincoln City", played:39, wins:25, draws:9, losses:5, goals_for:74, goals_against:34, goal_difference:40, points:84},
  {position:2, team:"Cardiff City", played:39, wins:23, draws:8, losses:8, goals_for:73, goals_against:41, goal_difference:32, points:77},
  {position:3, team:"Bolton Wanderers", played:39, wins:17, draws:15, losses:7, goals_for:55, goals_against:39, goal_difference:16, points:66},
  {position:4, team:"Bradford City", played:39, wins:19, draws:8, losses:12, goals_for:49, goals_against:44, goal_difference:5, points:65},
  {position:5, team:"Stockport County", played:38, wins:18, draws:9, losses:11, goals_for:54, goals_against:48, goal_difference:6, points:63},
  {position:6, team:"Reading", played:40, wins:16, draws:13, losses:11, goals_for:60, goals_against:51, goal_difference:9, points:61},
  {position:7, team:"Stevenage", played:38, wins:17, draws:9, losses:12, goals_for:41, goals_against:38, goal_difference:3, points:60},
  {position:8, team:"Wycombe Wanderers", played:40, wins:16, draws:11, losses:13, goals_for:59, goals_against:43, goal_difference:16, points:59},
  {position:9, team:"Plymouth Argyle", played:39, wins:18, draws:5, losses:16, goals_for:60, goals_against:54, goal_difference:6, points:59},
  {position:10, team:"Huddersfield Town", played:39, wins:16, draws:9, losses:14, goals_for:59, goals_against:51, goal_difference:8, points:57},
  {position:11, team:"Luton Town", played:39, wins:15, draws:10, losses:14, goals_for:52, goals_against:49, goal_difference:3, points:55},
  {position:12, team:"Peterborough United", played:38, wins:15, draws:5, losses:18, goals_for:57, goals_against:52, goal_difference:5, points:50},
  {position:13, team:"Barnsley", played:37, wins:13, draws:11, losses:13, goals_for:59, goals_against:60, goal_difference:-1, points:50},
  {position:14, team:"AFC Wimbledon", played:39, wins:14, draws:8, losses:17, goals_for:49, goals_against:58, goal_difference:-9, points:50},
  {position:15, team:"Doncaster Rovers", played:39, wins:14, draws:8, losses:17, goals_for:42, goals_against:59, goal_difference:-17, points:50},
  {position:16, team:"Mansfield Town", played:37, wins:12, draws:13, losses:12, goals_for:47, goals_against:41, goal_difference:6, points:49},
  {position:17, team:"Leyton Orient", played:39, wins:14, draws:7, losses:18, goals_for:55, goals_against:62, goal_difference:-7, points:49},
  {position:18, team:"Burton Albion", played:40, wins:12, draws:10, losses:18, goals_for:44, goals_against:55, goal_difference:-11, points:46},
  {position:19, team:"Wigan Athletic", played:39, wins:11, draws:12, losses:16, goals_for:41, goals_against:54, goal_difference:-13, points:45},
  {position:20, team:"Blackpool", played:40, wins:12, draws:9, losses:19, goals_for:47, goals_against:63, goal_difference:-16, points:45},
  {position:21, team:"Exeter City", played:40, wins:11, draws:10, losses:19, goals_for:42, goals_against:52, goal_difference:-10, points:43},
  {position:22, team:"Rotherham United", played:38, wins:9, draws:9, losses:20, goals_for:35, goals_against:58, goal_difference:-23, points:36},
  {position:23, team:"Northampton Town", played:39, wins:9, draws:8, losses:22, goals_for:33, goals_against:56, goal_difference:-23, points:35},
  {position:24, team:"Port Vale", played:38, wins:7, draws:10, losses:21, goals_for:29, goals_against:54, goal_difference:-25, points:31},
];
  
function populateTable() {
  const tbody = document.querySelector("#leagueTable tbody");
  tbody.innerHTML = "";

  leagueData.forEach(team => {
    const row = document.createElement("tr");

    let displayName = team.team;
    if(displayName === "Luton Town") displayName = "Whistle FC";

    // Promotion / Playoff / Relegation
    if(team.position <= 2) row.classList.add("promotion");
    else if(team.position >= 3 && team.position <= 6) row.classList.add("playoff");
    else if(team.position >= 21) row.classList.add("relegation");

    // Highlight Whistle FC
    if(displayName === "Whistle FC") row.classList.add("whistle");

    row.innerHTML = `
      <td>${team.position}</td>
      <td>${displayName}</td>
      <td>${team.played}</td>
      <td>${team.wins}</td>
      <td>${team.draws}</td>
      <td>${team.losses}</td>
      <td>${team.goal_difference}</td>
      <td>${team.points}</td>
    `;

    tbody.appendChild(row);
  });
}

populateTable();
</script>

</body>
</html>
