<style>

/* =========================
   LEAGUE TABLE BASE
========================= */

/* =========================
   LEAGUE TABLE (FIXED)
========================= */

.league-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;

  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;

  color: var(--text); /* 🔥 FIX: readable text */
}

/* HEADERS */
.league-table th {
  background: #000;
  color: #fff;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* CELLS */
.league-table th,
.league-table td {
  padding: 12px 10px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

/* TEAM NAME */
.league-table td:nth-child(2) {
  text-align: left;
  font-weight: 600;
}

/* STRIPES */
.league-table tbody tr:nth-child(even) {
  background: var(--surface-light);
}


/* =========================
   ZONES
========================= */
.league-table tr.promotion {
  border-left: 4px solid #2e7d32;
}

.league-table tr.playoff {
  border-left: 4px solid #f9a825;
}

.league-table tr.relegation {
  border-left: 4px solid #c62828;
}

/* =========================
   WHISTLE ROW (MAKE IT POP)
========================= */
.league-table tr.whistle {
  background: linear-gradient(90deg, #c00000, #7a0000);
  border-left: 6px solid #ff2d2d !important;

  transform: scale(1.01); /* subtle lift */
}

/* TEXT */
.league-table tr.whistle td {
  color: #fff;
  font-weight: 700;
}

/* ADD A GLOW EFFECT */
.league-table tr.whistle {
  box-shadow: 0 0 12px rgba(255, 45, 45, 0.6);
}

/* PREVENT HOVER OVERRIDING */
.league-table tr.whistle:hover {
  background: linear-gradient(90deg, #c00000, #7a0000);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
  .col-extra {
    display: none;
  }

  .league-table th,
  .league-table td {
    padding: 8px 6px;
    font-size: 13px;
  }

  .league-table td:nth-child(2) {
    min-width: 120px;
  }
}

</style>

</head>

/* =========================
   BUILD TABLE
========================= */

const tbody = document.querySelector("#leagueTable tbody");

leagueData.forEach(team => {

  const row = document.createElement("tr");

  const gd = team.gf - team.ga;

  let name = team.team;
  if (name === "Luton Town") name = "Whistle FC";

  if (team.position <= 2) row.classList.add("promotion");
  else if (team.position <= 6) row.classList.add("playoff");
  else if (team.position >= 21) row.classList.add("relegation");

  if (name === "Whistle FC") row.classList.add("whistle");

  row.innerHTML = `
    <td>${team.position}</td>
    <td>${name}</td>
    <td>${team.played}</td>
    <td class="col-extra">${team.wins}</td>
    <td class="col-extra">${team.draws}</td>
    <td class="col-extra">${team.losses}</td>
    <td>${gd > 0 ? "+" + gd : gd}</td>
    <td>${team.points}</td>
  `;

  tbody.appendChild(row);

});
