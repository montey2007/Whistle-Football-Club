<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   LEAGUE TABLE BASE
========================= */

.league-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
}

.league-table th,
.league-table td {
  text-align: center;
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.league-table th {
  background: #111;
  color: #fff;
  font-size: 14px;
}

.league-table td:nth-child(2) {
  text-align: left;
  font-weight: 600;
}

/* =========================
   ZONE INDICATORS (LEFT BAR ONLY)
========================= */

.league-table tr.promotion {
  border-left: 5px solid #2e7d32;
}

.league-table tr.playoff {
  border-left: 5px solid #f9a825;
}

.league-table tr.relegation {
  border-left: 5px solid #c62828;
}

/* =========================
   WHISTLE (FULL ROW HIGHLIGHT - OVERRIDES EVERYTHING)
========================= */

.league-table tr.whistle {
  background: #ffd6d6;
  border-left: 6px solid #ff0000 !important;
  font-weight: 700;
}

.league-table tr.whistle td {
  color: #990000;
}

/* If Whistle is also in a zone, still override border */
.league-table tr.whistle.promotion,
.league-table tr.whistle.playoff,
.league-table tr.whistle.relegation {
  border-left: 6px solid #ff0000 !important;
}

/* =========================
   HOVER
========================= */

.league-table tbody tr:hover {
  background: #f9f9f9;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
  .col-extra {
    display: none;
  }

  .league-table th,
  .league-table td {
    padding: 8px 6px;
    font-size: 13px;
  }

  .league-table td:nth-child(2) {
    min-width: 120px;
  }
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">

    <div class="club-title">

<div class="container">

<h2 class="section-title">League One Table</h2>

<table class="league-table" id="leagueTable">

<thead>
<tr>
  <th>Pos</th>
  <th>Team</th>
  <th>P</th>
  <th class="col-extra">W</th>
  <th class="col-extra">D</th>
  <th class="col-extra">L</th>
  <th>GD</th>
  <th>Pts</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<script>

/* =========================
   DATA
========================= */

const leagueData = [
  { position: 1, team: "Lincoln City", played: 41, wins: 27, draws: 9, losses: 5, gf: 77, ga: 35, points: 90 },
  { position: 2, team: "Cardiff City", played: 40, wins: 23, draws: 9, losses: 8, gf: 74, ga: 42, points: 78 },
  { position: 3, team: "Bradford City", played: 41, wins: 21, draws: 8, losses: 12, gf: 52, ga: 45, points: 71 },
  { position: 4, team: "Bolton Wanderers", played: 41, wins: 18, draws: 16, losses: 7, gf: 58, ga: 41, points: 70 },
  { position: 5, team: "Stockport", played: 40, wins: 19, draws: 10, losses: 11, gf: 58, ga: 49, points: 67 },
  { position: 6, team: "Stevenage", played: 40, wins: 18, draws: 10, losses: 12, gf: 43, ga: 39, points: 64 },
  { position: 7, team: "Plymouth Argyle", played: 41, wins: 19, draws: 5, losses: 17, gf: 63, ga: 57, points: 62 },
  { position: 8, team: "Reading", played: 42, wins: 16, draws: 14, losses: 12, gf: 62, ga: 54, points: 62 },
  { position: 9, team: "Huddersfield Town", played: 41, wins: 17, draws: 10, losses: 14, gf: 61, ga: 53, points: 61 },
  { position: 10, team: "Luton Town", played: 41, wins: 17, draws: 10, losses: 14, gf: 55, ga: 51, points: 61 },
  { position: 11, team: "Wycombe Wanderers", played: 42, wins: 16, draws: 11, losses: 15, gf: 60, ga: 48, points: 59 },
  { position: 12, team: "Mansfield Town", played: 39, wins: 13, draws: 14, losses: 12, gf: 50, ga: 42, points: 53 },
  { position: 13, team: "Peterborough United", played: 40, wins: 15, draws: 6, losses: 19, gf: 59, ga: 55, points: 51 },
  { position: 14, team: "Barnsley", played: 39, wins: 13, draws: 12, losses: 14, gf: 61, ga: 63, points: 51 },
  { position: 15, team: "Leyton Orient", played: 41, wins: 14, draws: 8, losses: 19, gf: 56, ga: 64, points: 50 },
  { position: 16, team: "AFC Wimbledon", played: 41, wins: 14, draws: 8, losses: 19, gf: 50, ga: 61, points: 50 },
  { position: 17, team: "Doncaster Rovers", played: 41, wins: 14, draws: 8, losses: 19, gf: 43, ga: 63, points: 50 },
  { position: 18, team: "Wigan Athletic", played: 41, wins: 12, draws: 13, losses: 16, gf: 43, ga: 55, points: 49 },
  { position: 19, team: "Burton Albion", played: 42, wins: 12, draws: 12, losses: 18, gf: 46, ga: 57, points: 48 },
  { position: 20, team: "Blackpool", played: 42, wins: 13, draws: 9, losses: 20, gf: 49, ga: 65, points: 48 },
  { position: 21, team: "Exeter City", played: 42, wins: 12, draws: 10, losses: 20, gf: 44, ga: 54, points: 46 },
  { position: 22, team: "Rotherham United", played: 39, wins: 9, draws: 10, losses: 20, gf: 35, ga: 58, points: 37 },
  { position: 23, team: "Northampton Town", played: 41, wins: 9, draws: 8, losses: 24, gf: 34, ga: 59, points: 35 },
  { position: 24, team: "Port Vale", played: 38, wins: 7, draws: 10, losses: 21, gf: 29, ga: 54, points: 31 }
];

/* =========================
   BUILD TABLE
========================= */

const tbody = document.querySelector("#leagueTable tbody");

leagueData.forEach(team => {

  const row = document.createElement("tr");

  const gd = team.gf - team.ga;

  let name = team.team;
  if (name === "Luton Town") name = "Whistle FC";

  if (team.position <= 2) row.classList.add("promotion");
  else if (team.position <= 6) row.classList.add("playoff");
  else if (team.position >= 21) row.classList.add("relegation");

  if (name === "Whistle FC") row.classList.add("whistle");

  row.innerHTML = `
    <td>${team.position}</td>
    <td>${name}</td>
    <td>${team.played}</td>
    <td class="col-extra">${team.wins}</td>
    <td class="col-extra">${team.draws}</td>
    <td class="col-extra">${team.losses}</td>
    <td>${gd > 0 ? "+" + gd : gd}</td>
    <td>${team.points}</td>
  `;

  tbody.appendChild(row);

});

</script>

</body>
