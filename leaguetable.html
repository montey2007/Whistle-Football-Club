<!DOCTYPE html>
<html>

<head>
<title>League One Table</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1>League One Table</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="players.html">Players</a>
<a href="staff.html">Staff</a>
<a href="history.html">History</a>
<a href="fixtures.html">Fixtures</a>
<a href="results.html">Results</a>
<a href="leaguetable.html">League Table</a>
</nav>

<div class="container">

<table class="league-table" id="leagueTable">
<thead>
<tr>
<th>Pos</th>
<th>Team</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GD</th>
<th>Pts</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</div>

<script>

fetch("https://api.football-data.org/v4/competitions/FL1/standings", {
headers: { "X-Auth-Token": "1a7ea9ac87d94c3c9f123969bb4f8c84" }
})
.then(response => response.json())
.then(data => {

const tableBody = document.querySelector("#leagueTable tbody");

data.standings[0].table.forEach(team => {

let teamName = team.team.name;

/* Replace Luton with Whistle FC */
if(teamName === "Luton Town"){
teamName = "Whistle FC";
}

let row = document.createElement("tr");

/* Highlight Whistle FC */
if(teamName === "Whistle FC"){
row.classList.add("whistle");
}

row.innerHTML = `
<td>${team.position}</td>
<td>${teamName}</td>
<td>${team.playedGames}</td>
<td>${team.won}</td>
<td>${team.draw}</td>
<td>${team.lost}</td>
<td>${team.goalDifference}</td>
<td>${team.points}</td>
`;

tableBody.appendChild(row);

});

});

</script>

</body>
</html>
