<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>League One Table</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   LEAGUE TABLE
========================= */

.league-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  color: var(--text);
}

.league-table th {
  background: #000;
  color: #fff;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.league-table th,
.league-table td {
  padding: 12px 10px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

.league-table td:nth-child(2) {
  text-align: left;
  font-weight: 600;
}

.league-table tbody tr:nth-child(even) {
  background: var(--surface-light);
}

/* ZONES */
.promotion {
  border-left: 4px solid #2e7d32;
}

.playoff {
  border-left: 4px solid #f9a825;
}

.relegation {
  border-left: 4px solid #c62828;
}

/* WHISTLE ROW */
.whistle {
  background: linear-gradient(90deg, #c00000, #7a0000);
  border-left: 6px solid #ff2d2d !important;
  transform: scale(1.01);
  box-shadow: 0 0 12px rgba(255, 45, 45, 0.6);
}

.whistle td {
  color: #fff;
  font-weight: 700;
}

.whistle:hover {
  background: linear-gradient(90deg, #c00000, #7a0000);
}

/* MOBILE */
@media (max-width: 600px) {
  .col-extra {
    display: none;
  }

  .league-table th,
  .league-table td {
    padding: 8px 6px;
    font-size: 13px;
  }

  .league-table td:nth-child(2) {
    min-width: 120px;
  }
}

</style>
</head>

<body>

<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>

    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>League One Table</p>
    </div>
  </div>
</header>

<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a class="active" href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">
  <h2 class="section-title">League One Table</h2>

  <table class="league-table" id="leagueTable">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Team</th>
        <th>P</th>
        <th class="col-extra">W</th>
        <th class="col-extra">D</th>
        <th class="col-extra">L</th>
        <th>GD</th>
        <th>Pts</th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>
</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<script>

/* =========================
   UPDATED LEAGUE DATA
========================= */
/* =========================
   UPDATED LEAGUE DATA
   EFL LEAGUE ONE 2026/27
========================= */

const leagueData = [
  { team: "Bradford City", played: 2, wins: 2, draws: 0, losses: 0, gf: 3, ga: 0, points: 6 },
  { team: "Huddersfield Town", played: 2, wins: 1, draws: 1, losses: 0, gf: 3, ga: 0, points: 4 },
  { team: "Luton Town", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Oxford United", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Cambridge United", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Blackpool", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Burton Albion", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Bromley", played: 2, wins: 1, draws: 1, losses: 0, gf: 1, ga: 0, points: 4 },
  { team: "Stockport County", played: 2, wins: 1, draws: 0, losses: 1, gf: 1, ga: 0, points: 3 },
  { team: "Leyton Orient", played: 2, wins: 1, draws: 0, losses: 1, gf: 1, ga: 0, points: 3 },
  { team: "Mansfield Town", played: 2, wins: 1, draws: 0, losses: 1, gf: 0, ga: 0, points: 3 },
  { team: "Sheffield Wednesday", played: 2, wins: 1, draws: 0, losses: 1, gf: 0, ga: 0, points: 3 },
  { team: "Peterborough United", played: 2, wins: 1, draws: 0, losses: 1, gf: 0, ga: 1, points: 3 },
  { team: "MK Dons", played: 2, wins: 0, draws: 2, losses: 0, gf: 0, ga: 0, points: 2 },
  { team: "Notts County", played: 2, wins: 0, draws: 2, losses: 0, gf: 0, ga: 0, points: 2 },
  { team: "Wycombe Wanderers", played: 2, wins: 0, draws: 2, losses: 0, gf: 0, ga: 0, points: 2 },
  { team: "Reading", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 1, points: 1 },
  { team: "Leicester City", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 1, points: 1 },
  { team: "Stevenage", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 1, points: 1 },
  { team: "Doncaster Rovers", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 1, points: 1 },
  { team: "Barnsley", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 1, points: 1 },
  { team: "Plymouth Argyle", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 2, points: 1 },
  { team: "AFC Wimbledon", played: 2, wins: 0, draws: 1, losses: 1, gf: 0, ga: 3, points: 1 },
  { team: "Wigan Athletic", played: 2, wins: 0, draws: 0, losses: 2, gf: 0, ga: 3, points: 0 }
];
   
/* =========================
   BUILD TABLE
========================= */

const tbody = document.querySelector("#leagueTable tbody");

leagueData.forEach((team, index) => {
  const row = document.createElement("tr");
  const gd = team.gf - team.ga;

  let name = team.team === "Luton Town" ? "Whistle FC" : team.team;

  if (index < 2) {
    row.classList.add("promotion");
  } else if (index < 6) {
    row.classList.add("playoff");
  } else if (index >= 20) {
    row.classList.add("relegation");
  }

  if (name === "Whistle FC") {
    row.classList.add("whistle");
  }

  row.innerHTML = `
    <td>${index + 1}</td>
    <td>${name}</td>
    <td>${team.played}</td>
    <td class="col-extra">${team.wins}</td>
    <td class="col-extra">${team.draws}</td>
    <td class="col-extra">${team.losses}</td>
    <td>${gd > 0 ? "+" + gd : gd}</td>
    <td>${team.points}</td>
  `;

  tbody.appendChild(row);
});

</script>

</body>
</html>
