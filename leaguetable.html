<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>League One Table</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   LEAGUE TABLE
========================= */

.league-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  color: var(--text);
}

.league-table th {
  background: #000;
  color: #fff;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.league-table th,
.league-table td {
  padding: 12px 10px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

.league-table td:nth-child(2) {
  text-align: left;
  font-weight: 600;
}

.league-table tbody tr:nth-child(even) {
  background: var(--surface-light);
}

/* ZONES */
.promotion { border-left: 4px solid #2e7d32; }
.playoff { border-left: 4px solid #f9a825; }
.relegation { border-left: 4px solid #c62828; }

/* WHISTLE ROW */
.whistle {
  background: linear-gradient(90deg, #c00000, #7a0000);
  border-left: 6px solid #ff2d2d !important;
  transform: scale(1.01);
  box-shadow: 0 0 12px rgba(255, 45, 45, 0.6);
}

.whistle td {
  color: #fff;
  font-weight: 700;
}

.whistle:hover {
  background: linear-gradient(90deg, #c00000, #7a0000);
}

/* MOBILE */
@media (max-width: 600px) {
  .col-extra { display: none; }

  .league-table th,
  .league-table td {
    padding: 8px 6px;
    font-size: 13px;
  }

  .league-table td:nth-child(2) {
    min-width: 120px;
  }
}

</style>
</head>

<body>

<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <img src="images/logo.png" alt="Whistle FC Logo">
    </div>
    <div class="club-title">
      <h1>Whistle Football Club</h1>
      <p>League One Table</p>
    </div>
  </div>
</header>

<nav class="navbar">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="players.html">Players</a></li>
    <li><a href="staff.html">Staff</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a class="active" href="leaguetable.html">League Table</a></li>
  </ul>
</nav>

<div class="container">
<h2 class="section-title">League One Table</h2>

<table class="league-table" id="leagueTable">
<thead>
<tr>
  <th>Pos</th>
  <th>Team</th>
  <th>P</th>
  <th class="col-extra">W</th>
  <th class="col-extra">D</th>
  <th class="col-extra">L</th>
  <th>GD</th>
  <th>Pts</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 Whistle Football Club</p>
    <p>Vitality Stadium | Wetshil, England</p>
  </div>
</footer>

<script>

/* =========================
   UPDATED DATA
========================= */

const leagueData = [
  { team: "Lincoln City", played: 45, wins: 30, draws: 10, losses: 5, gf: 87, ga: 41, points: 100 },
  { team: "Cardiff City", played: 45, wins: 27, draws: 10, losses: 8, gf: 86, ga: 45, points: 91 },
  { team: "Bolton Wanderers", played: 45, wins: 19, draws: 18, losses: 8, gf: 68, ga: 49, points: 75 },
  { team: "Stockport County", played: 44, wins: 21, draws: 11, losses: 12, gf: 67, ga: 55, points: 74 },
  { team: "Bradford City", played: 45, wins: 21, draws: 11, losses: 13, gf: 56, ga: 50, points: 74 },
  { team: "Stevenage", played: 45, wins: 20, draws: 12, losses: 13, gf: 48, ga: 46, points: 72 },
  { team: "Luton Town", played: 45, wins: 20, draws: 11, losses: 14, gf: 65, ga: 54, points: 71 },
  { team: "Plymouth Argyle", played: 45, wins: 21, draws: 7, losses: 17, gf: 72, ga: 61, points: 70 },
  { team: "Huddersfield Town", played: 45, wins: 17, draws: 13, losses: 15, gf: 70, ga: 64, points: 64 },
  { team: "Reading", played: 45, wins: 16, draws: 15, losses: 14, gf: 64, ga: 59, points: 63 },
  { team: "Mansfield Town", played: 44, wins: 15, draws: 16, losses: 13, gf: 57, ga: 46, points: 61 },
  { team: "Wycombe Wanderers", played: 45, wins: 16, draws: 12, losses: 17, gf: 66, ga: 56, points: 60 },
  { team: "Blackpool", played: 45, wins: 16, draws: 9, losses: 20, gf: 53, ga: 65, points: 57 },
  { team: "Doncaster Rovers", played: 45, wins: 16, draws: 9, losses: 20, gf: 47, ga: 68, points: 57 },
  { team: "Barnsley", played: 44, wins: 14, draws: 14, losses: 16, gf: 66, ga: 70, points: 56 },
  { team: "Wigan Athletic", played: 45, wins: 14, draws: 14, losses: 17, gf: 49, ga: 57, points: 56 },
  { team: "Burton Albion", played: 45, wins: 13, draws: 14, losses: 18, gf: 48, ga: 58, points: 53 },
  { team: "AFC Wimbledon", played: 45, wins: 15, draws: 8, losses: 22, gf: 51, ga: 68, points: 53 },
  { team: "Peterborough United", played: 44, wins: 15, draws: 7, losses: 22, gf: 63, ga: 65, points: 52 },
  { team: "Leyton Orient", played: 45, wins: 14, draws: 9, losses: 22, gf: 57, ga: 69, points: 51 },
  { team: "Exeter City", played: 45, wins: 12, draws: 13, losses: 20, gf: 51, ga: 59, points: 49 },
  { team: "Rotherham United", played: 45, wins: 10, draws: 11, losses: 24, gf: 39, ga: 68, points: 41 },
  { team: "Port Vale", played: 44, wins: 9, draws: 12, losses: 23, gf: 34, ga: 58, points: 39 },
  { team: "Northampton Town", played: 44, wins: 9, draws: 8, losses: 27, gf: 37, ga: 70, points: 35 }
];

/* =========================
   BUILD TABLE
========================= */

const tbody = document.querySelector("#leagueTable tbody");

leagueData.forEach((team, index) => {

  const row = document.createElement("tr");

  const gd = team.gf - team.ga;

  let name = team.team === "Luton Town" ? "Whistle FC" : team.team;

  // ZONES
  if (index < 2) row.classList.add("promotion");
  else if (index < 6) row.classList.add("playoff");
  else if (index >= 20) row.classList.add("relegation");

  // WHISTLE
  if (name === "Whistle FC") row.classList.add("whistle");

  row.innerHTML = `
    <td>${index + 1}</td>
    <td>${name}</td>
    <td>${team.played}</td>
    <td class="col-extra">${team.wins}</td>
    <td class="col-extra">${team.draws}</td>
    <td class="col-extra">${team.losses}</td>
    <td>${gd > 0 ? "+" + gd : gd}</td>
    <td>${team.points}</td>
  `;

  tbody.appendChild(row);

});

</script>

</body>
</html>
